CONFIG_PWM=y

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DEFAULT_IF_ETHERNET=y
CONFIG_NET_DEFAULT_IF_FIRST=n


CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y

CONFIG_NET_SOCKETS=y
# CONFIG_NET_LOG=y

# Use DHCP for IPv4
CONFIG_NET_DHCPV4=y

CONFIG_NET_CONFIG_AUTO_INIT=n

# Enabling logging can be helpful for debugging
#CONFIG_WIFI_LOG_LEVEL_ERR=y
#CONFIG_NET_IPV6_LOG_LEVEL_DBG=y

#CONFIG_NET_BUF_VARIABLE_DATA_SIZE=y
#CONFIG_NET_PKT_BUF_RX_DATA_POOL_SIZE=4096
#CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=4096


CONFIG_NET_BUF_FIXED_DATA_SIZE=y
CONFIG_NET_BUF_DATA_SIZE=128
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_PKT_RX_COUNT=14
CONFIG_NET_PKT_TX_COUNT=14
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=36

#CONFIG_NET_TX_STACK_SIZE=4096
#CONFIG_NET_RX_STACK_SIZE=4096
#CONFIG_NET_BUF_DATA_SIZE=256
#CONFIG_NET_PKT_RX_COUNT=40
#CONFIG_NET_PKT_TX_COUNT=20
#CONFIG_NET_BUF_RX_COUNT=40
#CONFIG_NET_BUF_TX_COUNT=30


# Added to prevent error with missing #include <ethernet/eth_stats.h> for esp_wifi_drv.c
# Adding this line will cause CMAKE Warning: No SOURCES given to Zephyr library: drivers__ethernet
# Just ignore.
CONFIG_NET_L2_ETHERNET=y

# Enable net conn manager
CONFIG_NET_CONNECTION_MANAGER=y
        

CONFIG_RTC=y
    

CONFIG_SNTP=y

CONFIG_NET_MAX_CONTEXTS=4
CONFIG_ZVFS_POLL_MAX=4
CONFIG_NET_SOCKETS_POLL_MAX=4
CONFIG_NET_MAX_CONN=4
CONFIG_NET_TCP_KEEPALIVE=y
CONFIG_NET_TCP_KEEPCNT_DEFAULT=4
CONFIG_NET_IF_MAX_IPV4_COUNT=2


###################################
# ADDITIONALLY ADDED FOR CELLULAR #
###################################

#*******************************************
# Change these parameters to DISABLE SHELL #
# NOTE: Set them all to 'n' 
#*******************************************
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_UART_CONSOLE=n

#**********************************************
# Change these parameters to SAVE FLASH & RAM #
# NOTE: Set them all to 'n'                   #
#**********************************************
CONFIG_SHELL=n
CONFIG_NET_SHELL=n
CONFIG_PM_DEVICE_SHELL=n

#**********************************************
# Change these parameters to SAVE FLASH & RAM #
# NOTE: Set them all to 'n'                   #
#**********************************************
# driver-level modem logs
CONFIG_MODEM_LOG_LEVEL_DBG=n
# Shared modem subsystem logs such as `modem_chat`, `modem_ppp`, and the modem UART backends; 
# NOTE: Useful for AT script flow, PPP frame parsing, and UART RX/TX issues.
CONFIG_MODEM_MODULES_LOG_LEVEL_DBG=n
# Project custom modem PPP logs; PPP functionality remains enabled when disabled.
CONFIG_MODEM_PPP_CUSTOM_LOGGING_ENABLE=n
# PPP FSM/LCP/IPCP negotiation logs, PPP RX/TX packet hexdumps, and PPP link events such as `Starting LCP` and `Link established`.
# NOTE: If CONFIG_NET_L2_PPP_LOG_LEVEL_DBG=y, then MUST set CONFIG_NET_LOG=y (if not done yet)
#   otherwise PPP FSM/LCP/IPCP state transitions and negotiation logging will NOT be shown
CONFIG_NET_L2_PPP_LOG_LEVEL_DBG=n
CONFIG_NET_LOG=n
# CMUX state-machine logs, DLCI open/close events, CMUX control-command handling, and CMUX parser/FCS/buffer errors.
CONFIG_MODEM_CMUX_LOG_LEVEL_DBG=n
# CMUX frame summaries/hexdump
# If CONFIG_MODEM_CMUX_LOG_FRAMES=y, then MUST set CONFIG_MODEM_CMUX_LOG_LEVEL_DBG=y (if not done yet)
# NOTE: Only ENABLE this debug log ONLY IF necessary and you want to see the CMUX frame hexdumps
#   Logs will be produced periodically (e.g., 30 seconds3)
CONFIG_MODEM_CMUX_LOG_FRAMES=n
# Keep DBG output concise; module name is enough without function prefix.
# CONFIG_LOG_FUNC_NAME_PREFIX_DBG is not set
 
# Show startup "Available commands" banner (set to n to hide menu)
CONFIG_APP_TB45_SHOW_AVAILABLE_COMMANDS_MENU=n
 
# Enable/Disable SMS
CONFIG_APP_TB45_SMS_ENABLE=n
#**********************************************
 
# Shell Wildcard and Stack Size
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_STACK_SIZE=2112

# Debug Log Settings
# Enable/disable startup ppp check LOG_WRN progress lines
CONFIG_APP_TB45_PPP_CHECK_WARN_LOGS=y


# PM (=Power management) is needed for tb45 cell SUSPEND/RESUME
CONFIG_PM_DEVICE=y
CONFIG_NET_NATIVE=y
CONFIG_NET_CONTEXT_RCVTIMEO=y
 
# Ethernet + PPP both need IPv4 contexts.
# NOTE: by default this was set to '1', which caused the IPCP
#   NOT to complete and thus no IP address assigned to the modem PPP interface.
CONFIG_NET_IF_MAX_IPV4_COUNT=2
 
# Ensure PPP is the primary L2 for the modem
CONFIG_NET_L2_PPP=y
 
CONFIG_MODEM=y
CONFIG_MODEM_DEDICATED_WORKQUEUE=n
CONFIG_MODEM_MODULES=y
CONFIG_MODEM_PIPE=y
CONFIG_MODEM_PIPELINK=y
CONFIG_MODEM_CHAT=y
CONFIG_MODEM_PPP=y
CONFIG_MODEM_BACKEND_UART=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
# The TB45 library owns the modem_at_user_pipe implementation.
CONFIG_MODEM_AT_USER_PIPE=n
CONFIG_APP_TB45_MODEM_AT_USER_PIPE=y
CONFIG_APP_TB45_MODEM_AT_USER_PIPE_IDX=0
CONFIG_MODEM_AT_SHELL=n
# Network mode override (-1 = OFF, 2 = AUTO, 38)
CONFIG_APP_TB45_MODEM_NETWORK_MODE_OVERRIDE=-1
# 0 = infinite; default = 30
CONFIG_APP_TB45_MODEM_BRINGUP_MAX_RETRIES=30
# Registration failures before manual carrier selection falls back to AUTO
CONFIG_APP_TB45_MODEM_CARRIER_AUTO_FALLBACK_RETRIES=3
CONFIG_APP_TB45_MODEM_NEW_BAUDRATE=115200

# Custom modem_chat grouped debug-text buffer for combined TX/RX log records.
# Increasing it allows more command responses in one log record but does not
# increase the global logger queue or directly prevent `messages dropped`.
CONFIG_MODEM_CHAT_LOG_BUFFER_SIZE=128
# Raw UART backend RX/TX buffer size used between the modem UART and CMUX/chat parser.
# Each modem instance allocates one RX buffer and one TX buffer of this size
# (256 + 256 = 512 bytes RAM at the current setting).
CONFIG_APP_TB45_MODEM_UART_BUFFER_SIZES=256
# Modem chat parser receive buffer for incoming AT responses.
# This is separate from CONFIG_MODEM_CHAT_LOG_BUFFER_SIZE (grouped debug text)
# and CONFIG_LOG_BUFFER_SIZE (the global Zephyr logger queue).
CONFIG_APP_TB45_MODEM_CHAT_BUFFER_SIZE=128

# NOTE: If set `CONFIG_APP_TB45_MODEM_USER_PIPE_BUFFER_SIZES` too low, then
# 1. system may reboot by itself when running command `tb45 show probe_info`
# 2. warning may occur saying '<wrn> modem_cmux: DLCI 3 receive buffer is full`
CONFIG_APP_TB45_MODEM_USER_PIPE_BUFFER_SIZES=272
CONFIG_APP_TB45_MODEM_INIT_PRIORITY=79
CONFIG_APP_TB45_MODEM_NEW_BAUDRATE_DELAY=300
CONFIG_APP_TB45_MODEM_RESET_POWER_ON_DELAY_MS=500
CONFIG_APP_TB45_MODEM_PERIODIC_SCRIPT_MS=3000
CONFIG_APP_TB45_PING_COUNT_DEFAULT=4
CONFIG_APP_TB45_GOOGLE_IPV4="8.8.8.8"
CONFIG_APP_TB45_PPP_PERIODIC_PROBE_INTERVAL_MS=30000
CONFIG_APP_TB45_PPP_PROBE_ENABLE=y
CONFIG_APP_TB45_PPP_PERIODIC_RECOVERY_COOLDOWN_MS=60000
 
# CMUX to use direct UART-to-PPP mapping
CONFIG_MODEM_CMUX=y
CONFIG_MODEM_CMUX_MTU=127
CONFIG_MODEM_CMUX_WORK_BUFFER_SIZE_EXTRA=0
# PPP data uses DLCI 1 and needs 512 extra receive-buffer bytes for fragmented
# network frames after the global CMUX extra is reduced to zero.
# This may be reduced after testing, but lower values cannot guarantee stability.
# Without this extra headroom, bursts can produce WARNING: '<wrn> modem_cmux: DLCI 1 receive buffer is full'
CONFIG_APP_TB45_MODEM_PPP_DLCI_RX_BUF_EXTRA=512
# DLCI 2 carries command/control traffic and modem URCs, so 128 extra bytes
# provide burst headroom without applying the extra to every CMUX buffer.
# Without this extra headroom, bursts can produce WARNING: '<wrn> modem_cmux: DLCI 2 receive buffer is full'
CONFIG_APP_TB45_MODEM_DLCI2_RX_BUF_EXTRA=128

# SMS message text max length (default is 160, but can be set lower to save memory if desired)
CONFIG_APP_TB45_SMS_TEXT_MAX_LEN=160
CONFIG_APP_TB45_SMS_PHONE_MAX_LEN=24
CONFIG_APP_TB45_SMS_SEND_ATTEMPT_TIMEOUT_MS=90000
CONFIG_APP_TB45_SMS_SEND_MAX_RETRIES=0
CONFIG_APP_TB45_SMS_SEND_RETRY_DELAY_MS=3000
CONFIG_APP_TB45_SMS_INIT_WAIT_MS=10000
CONFIG_APP_TB45_SMS_INIT_AT_TIMEOUT_MS=10000
CONFIG_APP_TB45_SMS_TRIGGER_EVENT_PATH=y
CONFIG_APP_TB45_SMS_EVENT_WORKER_PRIORITY=8
CONFIG_APP_TB45_SMS_SERIAL_RX_DEBOUNCE_MS=1000
CONFIG_APP_TB45_SMS_RESULT_WORKER_ENABLE=y
CONFIG_APP_TB45_SMS_RESULT_WORKER_PRIORITY=8
CONFIG_APP_TB45_SMS_RX_STARTUP_CLEANUP=n

# SMS result queue depth can be 1 because the application sequence sends one
# asynchronous SMS at a time and waits for its matching result event before
# starting the next message.
CONFIG_APP_TB45_SMS_RESULT_QUEUE_DEPTH=1
# CONFIG_APP_TB45_SMS_EVENT_QUEUE_DEPTH=2, because 1 is for the SENDING and 1 is for the RECEIVING, so total 2
CONFIG_APP_TB45_SMS_EVENT_QUEUE_DEPTH=2
CONFIG_APP_TB45_SMS_RX_TRIGGER_QUEUE_DEPTH=1
# Maximum unread SMS storage indexes parsed from one AT+CMGL scan.
# One receive event is published per parsed index in modem-returned order.
# This uses stack only: 2 bytes per configured index during scan handling.
CONFIG_APP_TB45_SMS_RX_SCAN_MAX_INDEXES=8
CONFIG_APP_TB45_ASYNC_JOB_QUEUE_DEPTH=2

# Enable Tibbit 45 library
CONFIG_TIBBIT_45=y
