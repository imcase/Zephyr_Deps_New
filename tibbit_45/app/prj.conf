CONFIG_CPP=y
# CONFIG_CPLUSPLUS=y
# CONFIG_LIB_CPLUSPLUS=y
CONFIG_GLIBCXX_LIBCPP=y


#CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=y
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="MyDevice"

CONFIG_REBOOT=y
